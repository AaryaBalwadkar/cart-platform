services:
  backend:
    image: cart-backend:1.0
    container_name: cart-backend
    build:
      context: ./backend
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    image: retail-cart:1.0
    container_name: retail-cart
    build:
      context: ./frontend
    ports:
      - "8083:80"
    depends_on:
      - backend
    restart: unless-stopped
