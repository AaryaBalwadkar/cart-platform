<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retail Cart</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 38rem; padding: 0 1rem; }
    input, button { font: inherit; padding: .5rem; margin: .25rem 0; }
    li { margin: .5rem 0; }
    #message { min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>Shopping Cart Active</h1>
  <form id="cart-form">
    <label for="item-name">Item</label>
    <input id="item-name" name="name" required>
    <label for="quantity">Quantity</label>
    <input id="quantity" name="quantity" type="number" min="1" step="1" value="1" required>
    <button type="submit">Add to cart</button>
  </form>
  <p id="message" role="status"></p>
  <h2>Cart (<span id="total">0</span>)</h2>
  <ul id="items"></ul>
  <script>
    const form = document.querySelector("#cart-form");
    const message = document.querySelector("#message");
    const itemsList = document.querySelector("#items");
    const total = document.querySelector("#total");

    async function refreshCart() {
      const response = await fetch("/api/cart");
      if (!response.ok) throw new Error("Could not load the cart");
      const cart = await response.json();
      total.textContent = cart.totalItems;
      itemsList.replaceChildren();
      for (const item of cart.items) {
        const row = document.createElement("li");
        row.textContent = `${item.name} × ${item.quantity}`;
        itemsList.append(row);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      try {
        const response = await fetch("/api/cart", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.querySelector("#item-name").value,
            quantity: Number(document.querySelector("#quantity").value)
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not add item");
        form.reset();
        document.querySelector("#quantity").value = 1;
        message.textContent = "Item added.";
        await refreshCart();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    refreshCart().catch((error) => { message.textContent = error.message; });
  </script>
</body>
</html>
